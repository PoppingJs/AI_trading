symbols_mode: top20_usdt_perp
symbol_rank_by: quote_volume_24h
timeframes:
  - 15m
  - 1h
  - 4h
  - 1d

strategy:
  # PRD v4.0；紧急回退可改为7并重启，旧持仓仍按自身plan_version管理
  score_model_version: 8
  score_threshold: 75
  watch_threshold: 55
  strict_trend_entry: false
  volume_window: 20
  volume_min_ratio: 1.2
  volume_extreme_ratio: 2.8
  ema_fast: 20
  ema_slow: 50
  ma_trend: 100
  bollinger_window: 20
  bollinger_stddev: 2.0
  rsi_window: 14
  atr_window: 14
  pullback_tolerance_atr: 0.6
  max_extension_atr: 2.2
  oi_mild_change_min: 0.001
  oi_extreme_change: 0.05
  oi_4h_entry_min: 0.03
  smart_money_window: 16
  smart_money_oi_flush: 0.035
  smart_money_oi_rebuild: 0.012
  smart_money_oi_trap: 0.018
  smart_money_price_move: 0.012
  smart_money_wick_atr: 0.7
  smart_money_min_wicks: 2
  smart_money_volume_ratio: 1.2
  structure_lookback: 20
  structure_buffer_atr: 0.4
  structure_grind_bars: 4
  structure_grind_tolerance_atr: 0.8
  sweep_wick_atr: 0.9
  wash_oi_drop_min: 0.003
  keltner_window: 20
  keltner_atr_multiplier: 2.0
  keltner_near_atr: 0.35
  qps_window: 20
  qps_min_ratio: 1.15
  qps_extreme_ratio: 4.0
  extreme_atr_pct: 0.06
  long_short_overcrowded_long: 2.2
  long_short_overcrowded_short: 0.45
  top_long_short_long_min: 1.1
  top_long_short_short_max: 0.9
  funding_long_min: -0.0001
  funding_long_max: 0.0005
  funding_short_min: -0.0005
  funding_short_max: 0.0001
  funding_hot_long: 0.0005
  funding_hot_short: -0.0005

risk:
  leverage_default: 5
  leverage_max: 5
  risk_per_trade: 0.005
  single_symbol_margin_limit: 0.10
  total_margin_limit: 0.50
  total_open_risk_limit: 0.02
  max_open_positions: 3
  daily_loss_limit: 0.0
  weekly_loss_limit: 0.0
  max_drawdown_circuit_breaker: 0.0
  max_consecutive_losses: 0
  cooldown_hours: 0
  atr_stop_buffer: 0.5
  time_stop_bars: 5
  first_take_profit_r: 1.0
  second_take_profit_r: 2.0
  first_take_profit_fraction: 0.35
  second_take_profit_fraction: 0.35
  trailing_remainder_fraction: 0.20
  trailing_activation_r: 2.0
  trailing_lock_r: 0.5

execution:
  paper_trading: true
  taker_fee_rate: 0.0004
  slippage_rate: 0.0003
